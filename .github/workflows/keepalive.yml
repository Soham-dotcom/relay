# Render's free tier puts the service to sleep after ~15 idle minutes, and waking it takes
# 30-90 s. Pinging the health check every 10 minutes keeps the live demo instantly available.
# (One always-on free service uses ~730 of Render's 750 free hours a month.)
name: Keep demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl --fail --silent --show-error --max-time 120 https://relay-h9qf.onrender.com/api/health
