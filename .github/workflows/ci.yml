name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relay" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://relay:relay@localhost:5432/relay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run install:all
      - name: Server typecheck
        run: npx prisma generate && npm run typecheck
        working-directory: server
      - name: Server tests (unit + API against Postgres, fake AI)
        run: npm test
        working-directory: server
      - name: Web build
        run: npm run build
        working-directory: web
